<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>羽球动作库</title>
<style>
  :root{
    --bg:#F6F8F6; --surface:#FFFFFF; --ink:#1A231E; --ink-2:#48544D; --ink-3:#71807A;
    --line:#DCE3DE; --accent:#1E7A5F; --accent-ink:#14614A; --accent-soft:#E4F0EA;
    --cork:#A8482C; --cork-soft:#F6E9E2; --amber:#9A6B12; --amber-soft:#F5EDDC;
    --court:#EAF1EC; --court-line:#FFFFFF; --on-accent:#FFFFFF; --shadow:0 4px 18px rgba(20,40,30,.08);
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111814; --surface:#18211C; --ink:#E7EEE9; --ink-2:#ADBBB2; --ink-3:#7E8C84;
      --line:#2A352F; --accent:#3FAE8B; --accent-ink:#63C4A5; --accent-soft:#1C2F27;
      --cork:#D07A5C; --cork-soft:#33221B; --amber:#D8A94E; --amber-soft:#2E2717;
      --court:#16211B; --court-line:#3A4A41; --on-accent:#0E1512; --shadow:0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#111814; --surface:#18211C; --ink:#E7EEE9; --ink-2:#ADBBB2; --ink-3:#7E8C84;
    --line:#2A352F; --accent:#3FAE8B; --accent-ink:#63C4A5; --accent-soft:#1C2F27;
    --cork:#D07A5C; --cork-soft:#33221B; --amber:#D8A94E; --amber-soft:#2E2717;
    --court:#16211B; --court-line:#3A4A41; --on-accent:#0E1512; --shadow:0 4px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.75}
  .wrap{max-width:1060px; margin:0 auto; padding:0 20px 80px}
  button{font-family:inherit}

  header{padding:48px 0 8px}
  .eyebrow{font-size:12px; letter-spacing:.3em; color:var(--accent-ink); font-weight:600; margin:0 0 10px}
  h1{font-family:var(--serif); font-weight:900; font-size:clamp(34px,6vw,50px); margin:0; letter-spacing:.05em}
  .sub{color:var(--ink-2); margin:10px 0 0; max-width:44em}
  .courtline{margin:26px 0 22px; border-top:3px solid var(--accent); border-bottom:1px solid var(--line); height:6px}

  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:26px}
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    padding:6px 15px; border-radius:999px; font-size:14px; cursor:pointer;
  }
  .chip:hover{border-color:var(--accent); color:var(--accent-ink)}
  .chip.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  #q{
    margin-left:auto; padding:7px 14px; border:1px solid var(--line); border-radius:8px;
    background:var(--surface); color:var(--ink); font-size:14px; min-width:180px;
  }
  #q:focus{outline:2px solid var(--accent); outline-offset:1px}
  @media (max-width:640px){ #q{margin-left:0; width:100%} }

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px;
    cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:10px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--accent)}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .thumb{background:var(--court); border-radius:8px; padding:6px; display:flex; justify-content:center}
  .thumb svg{display:block; width:100%; height:auto; max-height:120px}
  .card h3{margin:0; font-family:var(--serif); font-size:18px; font-weight:800}
  .card .en{font-size:12px; color:var(--ink-3); font-family:var(--mono); margin-top:2px}
  .card p{margin:0; font-size:13.5px; color:var(--ink-2); line-height:1.65;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tags{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .tag{font-size:11.5px; padding:2px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
  .tag.d入门{background:var(--accent-soft); color:var(--accent-ink)}
  .tag.d进阶{background:var(--amber-soft); color:var(--amber)}
  .tag.d高级{background:var(--cork-soft); color:var(--cork)}
  .empty{color:var(--ink-3); padding:40px 0; text-align:center}

  /* ---------- modal ---------- */
  #overlay{
    position:fixed; inset:0; background:rgba(10,20,15,.55); display:none;
    align-items:flex-start; justify-content:center; padding:4vh 16px; overflow-y:auto; z-index:50;
  }
  #overlay.open{display:flex}
  .sheet{
    background:var(--bg); border:1px solid var(--line); border-radius:14px; max-width:860px; width:100%;
    padding:26px 28px 34px; position:relative; box-shadow:var(--shadow); margin-bottom:6vh;
  }
  #close{
    position:absolute; top:14px; right:14px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-2); border-radius:8px; width:34px; height:34px; font-size:17px; cursor:pointer;
  }
  #close:hover{color:var(--cork); border-color:var(--cork)}
  .sheet .cat{font-size:12px; letter-spacing:.2em; color:var(--accent-ink); font-weight:700}
  .sheet h2{font-family:var(--serif); font-weight:900; font-size:clamp(24px,4vw,32px); margin:6px 0 2px}
  .sheet .en{font-family:var(--mono); font-size:13px; color:var(--ink-3)}
  .sheet .summary{color:var(--ink-2); margin:12px 0 18px; max-width:44em}

  .player{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px}
  .stage{background:var(--court); border-radius:8px; padding:6px; display:flex; justify-content:center}
  .stage svg{display:block; width:100%; height:auto; max-height:440px}
  .caption{
    margin-top:10px; text-align:center; font-size:15px; font-weight:700; min-height:1.8em;
    color:var(--accent-ink);
  }
  .controls{display:flex; gap:8px; justify-content:center; margin-top:8px}
  .ctl{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:8px; padding:5px 16px; font-size:13.5px; cursor:pointer}
  .ctl:hover{border-color:var(--accent); color:var(--accent-ink)}
  .phases{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px}
  .ph{font-size:12.5px; padding:3px 10px; border-radius:999px; background:var(--bg);
    border:1px solid var(--line); color:var(--ink-3)}
  .ph.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
  .tabs{display:flex; gap:8px; justify-content:center; margin:0 0 12px}
  .fseg{stroke:var(--ink-2)} .fseg.dim{opacity:.45}
  .frk{stroke:var(--accent-ink)}
  .fignote{text-align:center; color:var(--ink-3); font-size:13px; margin:6px 0 0}

  /* chain engine */
  .chainbox{display:flex; flex-wrap:wrap; gap:0; justify-content:center; padding:26px 6px 10px}
  .cnode{display:flex; align-items:center}
  .cdot{
    width:66px; height:66px; border-radius:50%; border:2px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:13px; font-weight:700; color:var(--ink-2); line-height:1.25; padding:4px;
    transition:all .25s ease;
  }
  .cnode.on .cdot{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);
    transform:scale(1.16); box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent)}
  .cnode.hit.on .cdot{border-color:var(--cork); background:var(--cork-soft); color:var(--cork)}
  .clink{width:26px; height:2px; background:var(--line)}
  .cnode.done .cdot{border-color:var(--accent)}
  .cnode.done + .cnode .clink,.cnode.on .clink{background:var(--accent)}
  @media (max-width:560px){ .cdot{width:56px;height:56px;font-size:12px} .clink{width:14px} }

  .detail{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px}
  @media (max-width:680px){.detail{grid-template-columns:1fr}}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px}
  .panel h4{margin:0 0 8px; font-size:14px; color:var(--accent-ink); letter-spacing:.06em}
  .panel.warn h4{color:var(--cork)}
  .panel ul{margin:0; padding-left:1.3em}
  .panel li{margin:6px 0; font-size:14px; color:var(--ink-2)}
  .panel li::marker{color:var(--accent-ink)}
  .panel.warn li::marker{color:var(--cork)}
  .rel{margin-top:14px; font-size:13.5px; color:var(--ink-3)}
  .rel a{color:var(--accent-ink); cursor:pointer; text-decoration:underline; margin-right:10px}
  footer{margin-top:56px; color:var(--ink-3); font-size:13px}
  @media (prefers-reduced-motion: reduce){ .card{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">步伐 · 启动 · 发力 · 防守</p>
    <h1>羽球动作库</h1>
    <p class="sub">数据驱动的羽毛球动作解析：每个动作一条结构化记录（要点 / 常见错误 / 训练法），配一段自绘动画——球场俯视步伐、发力链时序、垫步时机轴、防守覆盖区。点击卡片查看。</p>
    <div class="courtline"></div>
  </header>

  <div class="toolbar" id="cats"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>没有匹配的动作</p>

  <footer><p>数据层：<span style="font-family:var(--mono)">data/moves.json</span> · 结构参考 exercises-dataset 模式 · 动画为自绘示意，坐标基于标准单打场地（厘米）</p></footer>
</div>

<div id="overlay" role="dialog" aria-modal="true">
  <div class="sheet">
    <button id="close" aria-label="关闭">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="data/moves.js"></script>
<script>
(function(){
"use strict";
const MOVES = window.BADMINTON_MOVES || [];
const CATS = ["全部","步伐","手法","双打","启动与重心","发力技巧","防守"];
const TABNAME = {figure:"侧视姿态",chain:"发力链",footwork:"球场俯视",timing:"时机轴",stance:"站位",trajectory:"弧线视图"};
let curCat = "全部", curQ = "", runner = null;

/* ---------------- court svg ---------------- */
const C = { W:610, NET:0, TOP:-120, BASE:670, SSL:198, LSL:594, S1:46, S2:564, MID:305 };
function courtSvg(inner, mini){
  const sw = mini ? 6 : 3, swn = mini ? 8 : 5;
  return `<svg viewBox="-18 -132 646 828" ${mini?'aria-hidden="true"':''}>
    <rect x="0" y="${C.TOP}" width="${C.W}" height="120" fill="currentColor" opacity=".05"/>
    <rect x="0" y="0" width="${C.W}" height="${C.BASE}" fill="none" stroke="var(--court-line)" stroke-width="${sw}"/>
    <line x1="${C.S1}" y1="0" x2="${C.S1}" y2="${C.BASE}" stroke="var(--court-line)" stroke-width="${sw}"/>
    <line x1="${C.S2}" y1="0" x2="${C.S2}" y2="${C.BASE}" stroke="var(--court-line)" stroke-width="${sw}"/>
    <line x1="0" y1="${C.SSL}" x2="${C.W}" y2="${C.SSL}" stroke="var(--court-line)" stroke-width="${sw}"/>
    <line x1="0" y1="${C.LSL}" x2="${C.W}" y2="${C.LSL}" stroke="var(--court-line)" stroke-width="${sw}"/>
    <line x1="${C.MID}" y1="${C.SSL}" x2="${C.MID}" y2="${C.BASE}" stroke="var(--court-line)" stroke-width="${sw}"/>
    <line x1="-14" y1="0" x2="${C.W+14}" y2="0" stroke="var(--ink-3)" stroke-width="${swn}" opacity=".8"/>
    ${mini?'':'<text x="'+(C.W/2)+'" y="-96" text-anchor="middle" font-size="26" fill="var(--ink-3)" opacity=".8">对手半场</text>'}
    ${inner}
  </svg>`;
}
const lerp=(a,b,t)=>a+(b-a)*t;
const eases={ inout:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, out:t=>1-Math.pow(1-t,3) };
const easeFor=k=>(k==="lunge"||k==="jump"||k==="brake")?eases.out:eases.inout;

/* ---------------- thumbnails ---------------- */
function thumb(m){
  const a=m.anim;
  if(a.type==="footwork"){
    const pts=a.phases.map(p=>p.pos.join(",")).join(" ");
    const dots=a.phases.map(p=>`<circle cx="${p.pos[0]}" cy="${p.pos[1]}" r="13" fill="var(--accent)" opacity=".55"/>`).join("");
    return courtSvg(`<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-dasharray="20 14" opacity=".8"/>${dots}
      <circle cx="${a.phases[0].pos[0]}" cy="${a.phases[0].pos[1]}" r="20" fill="var(--accent)"/>
      ${a.phases2?`<circle cx="${a.phases2[0].pos[0]}" cy="${a.phases2[0].pos[1]}" r="19" fill="var(--court)" stroke="var(--ink-2)" stroke-width="7"/>`:""}`, true);
  }
  if(a.type==="trajectory"){
    const paths=a.arcs.map(arc=>{
      const pts=trjPts(arc).map(p=>p[0].toFixed(0)+","+p[1].toFixed(0)).join(" ");
      const col=TRJCOLOR[arc.kind||"main"];
      return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="8" opacity=".75"
        ${arc.kind&&arc.kind!=="main"?'stroke-dasharray="16 16"':''}/>`;}).join("");
    return trjCourt(paths,a.arcs[0].from[0]);
  }
  if(a.type==="figure"){
    const f=a.frames.find(x=>x.hit)||a.frames[a.frames.length-1], g=computeFig(f.pose);
    const sg=(p,q,w,c)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${c||'var(--ink-2)'}" stroke-width="${w}" stroke-linecap="round"/>`;
    return `<svg viewBox="150 50 390 460" aria-hidden="true">
      <line x1="160" y1="486" x2="530" y2="486" stroke="var(--line)" stroke-width="4"/>
      ${sg(g.rt,g.fk,10)}${sg(g.fk,g.fn,10)}${sg(g.rt,g.bk,10)}${sg(g.bk,g.bn,10)}
      ${sg(g.rt,g.sh,12)}<circle cx="${g.hd[0]}" cy="${g.hd[1]}" r="15" fill="none" stroke="var(--ink-2)" stroke-width="8"/>
      ${sg(g.sh,g.el,10,'var(--accent)')}${sg(g.el,g.wr,10,'var(--accent)')}${sg(g.wr,g.tp,5,'var(--accent-ink)')}
      <ellipse cx="${g.tp[0]}" cy="${g.tp[1]}" rx="13" ry="19" fill="none" stroke="var(--accent-ink)" stroke-width="5"
        transform="rotate(${(f.pose.racket||0)+90} ${g.tp[0]} ${g.tp[1]})"/></svg>`;
  }
  if(a.type==="chain"){
    const n=a.nodes.length, xs=i=>60+i*(500/(n-1));
    return `<svg viewBox="0 0 620 120" aria-hidden="true"><line x1="60" y1="60" x2="560" y2="60" stroke="var(--line)" stroke-width="6"/>
      ${a.nodes.map((_,i)=>`<circle cx="${xs(i)}" cy="60" r="${i===n-1?22:16}" fill="${i===n-1?'var(--cork)':'var(--accent)'}" opacity="${.45+.55*i/(n-1)}"/>`).join("")}</svg>`;
  }
  if(a.type==="timing"){
    return `<svg viewBox="0 0 620 160" aria-hidden="true">
      <path d="M40 90 L200 90 Q250 60 300 72 Q330 82 330 112 L360 96 L560 96" fill="none" stroke="var(--accent)" stroke-width="8"/>
      <line x1="330" y1="30" x2="330" y2="130" stroke="var(--cork)" stroke-width="6" stroke-dasharray="10 8"/>
      <circle cx="330" cy="112" r="16" fill="var(--accent)"/></svg>`;
  }
  const zones=(a.zones||[]).map(z=>`<rect x="${z.from[0]}" y="${z.from[1]}" width="${z.to[0]-z.from[0]}" height="${z.to[1]-z.from[1]}" rx="18" fill="var(--accent)" opacity=".28"/>`).join("");
  return courtSvg(zones+`<circle cx="${a.player[0]}" cy="${a.player[1]}" r="22" fill="var(--accent)"/>`, true);
}

/* ---------------- grid ---------------- */
function renderCats(){
  document.getElementById("cats").innerHTML =
    CATS.map(c=>`<button class="chip ${c===curCat?'on':''}" data-c="${c}">${c}</button>`).join("") +
    `<input id="q" type="search" placeholder="搜索动作 / 要点…" value="${curQ}">`;
  document.querySelectorAll("#cats .chip").forEach(b=>b.onclick=()=>{curCat=b.dataset.c; renderCats(); renderGrid();});
  const q=document.getElementById("q");
  q.oninput=()=>{curQ=q.value.trim(); renderGrid();};
}
function match(m){
  if(curCat!=="全部" && m.category!==curCat) return false;
  if(!curQ) return true;
  const hay=(m.name_zh+m.name_en+m.summary+m.key_points.join(" ")).toLowerCase();
  return hay.includes(curQ.toLowerCase());
}
function renderGrid(){
  const list=MOVES.filter(match);
  document.getElementById("empty").hidden = list.length>0;
  document.getElementById("grid").innerHTML=list.map(m=>`
    <button class="card" data-id="${m.id}">
      <div class="thumb">${thumb(m)}</div>
      <div><h3>${m.name_zh}</h3><div class="en">${m.id} · ${m.name_en}</div></div>
      <div class="tags"><span class="tag">${m.category}</span><span class="tag d${m.difficulty}">${m.difficulty}</span></div>
      <p>${m.summary}</p>
    </button>`).join("");
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>openMove(c.dataset.id));
}

/* ---------------- players ---------------- */
function stopRunner(){ if(runner){ runner.stop(); runner=null; } }

function footworkPlayer(host, anim){
  const ph=anim.phases;
  host.innerHTML=`<div class="stage">${courtSvg(`
      <g id="anTrail"></g><g id="anFp"></g>
      <g id="anShots"></g>
      ${anim.phases2?'<g id="anP2"><circle r="17" fill="var(--bg)" stroke="var(--ink-2)" stroke-width="5"/><circle r="6" fill="var(--ink-2)"/></g>':''}
      <g id="anP"><circle id="anRing" r="26" fill="none" stroke="var(--accent)" stroke-width="5" opacity="0"/>
        <circle r="17" fill="var(--accent)"/><circle r="7" fill="var(--bg)"/></g>`)}</div>
    <div class="caption" id="anCap"></div>
    ${anim.phases2?'<p class="fignote">实心 = 你 · 空心 = 搭档（同步移动）</p>':''}
    <div class="controls"><button class="ctl" id="anPlay">暂停</button><button class="ctl" id="anSlow">慢速</button></div>
    <div class="phases">${ph.map((p,i)=>`<span class="ph" data-i="${i}">${i+1}. ${p.label}</span>`).join("")}</div>`;
  const $=id=>host.querySelector(id);
  const P=$("#anP"), P2=$("#anP2"), ring=$("#anRing"), trail=$("#anTrail"), fp=$("#anFp"),
        shotsG=$("#anShots"), cap=$("#anCap"), NS="http://www.w3.org/2000/svg";
  const shots=anim.shuttle?(Array.isArray(anim.shuttle)?anim.shuttle:[anim.shuttle]):[];
  let i=0,t0=null,playing=true,speed=1,raf=0,shotEls=[],shotState=[];
  function seg(a,b,kind){
    const s=document.createElementNS("http://www.w3.org/2000/svg","line");
    s.setAttribute("x1",a[0]);s.setAttribute("y1",a[1]);s.setAttribute("x2",b[0]);s.setAttribute("y2",b[1]);
    s.setAttribute("stroke",kind==="brake"?"var(--cork)":"var(--accent)");
    s.setAttribute("stroke-width",kind==="recover"?5:8);
    if(kind==="recover")s.setAttribute("stroke-dasharray","14 12");
    s.setAttribute("opacity",".55"); trail.appendChild(s);
  }
  function foot(p){
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]);c.setAttribute("r",11);
    c.setAttribute("fill","var(--accent)");c.setAttribute("opacity",".4"); fp.appendChild(c);
  }
  function reset(){ i=0;t0=null;trail.innerHTML="";fp.innerHTML="";
    shotsG.innerHTML="";shotEls=shots.map(()=>{const g=document.createElementNS(NS,"g");g.setAttribute("opacity","0");
      const l=document.createElementNS(NS,"line");l.setAttribute("stroke","var(--cork)");l.setAttribute("stroke-width","6");l.setAttribute("stroke-dasharray","16 12");
      const c=document.createElementNS(NS,"circle");c.setAttribute("r","13");c.setAttribute("fill","var(--cork)");
      g.appendChild(l);g.appendChild(c);shotsG.appendChild(g);return{g,l,c};});
    shotState=shots.map(()=>0); }
  function setCap(k){ cap.textContent=`${k+1} / ${ph.length} · ${ph[k].label}`;
    host.querySelectorAll(".ph").forEach(e=>e.classList.toggle("on",+e.dataset.i===k)); }
  function shuttleTick(now,phStart){
    shots.forEach((s,k)=>{ if(s.at!==i||shotState[k]===2)return;
      const d=Math.min(1,(now-phStart)/450), e=shotEls[k],
            x=lerp(s.from[0],s.to[0],eases.out(d)), y=lerp(s.from[1],s.to[1],eases.out(d));
      e.g.setAttribute("opacity","1");

/* ---- trajectory engine: side-view shuttle arcs over the full court (x 0–1340cm, net at 670; heights in cm) ---- */
const TRJ={ground:730,sy:0.85,net:670};
const trjY=h=>TRJ.ground-h*TRJ.sy;
const TRJCOLOR={main:"var(--accent)",alt:"var(--accent-ink)",bad:"var(--cork)"};

  for(let k=0;k<=64;k++){const t=k/64,u=1-t;

  return pts;
}

      <div class="panel"><h4>要点</h4><ul>${m.key_points.map(k=>`<li>${k}</li>`).join("")}</ul></div>
      <div class="panel warn"><h4>常见错误</h4><ul>${m.common_mistakes.map(k=>`<li>${k}</li>`).join("")}</ul></div>
      <div class="panel" style="grid-column:1/-1"><h4>训练方法</h4><ul>${m.drills.map(k=>`<li>${k}</li>`).join("")}</ul></div>
    </div>
    ${m.related&&m.related.length?`<div class="rel">相关动作：${m.related.map(r=>{
        const rm=MOVES.find(x=>x.id===r); return rm?`<a data-go="${r}">${rm.name_zh}</a>`:"";}).join("")}</div>`:""}`;
  const host=body.querySelector("#playerHost");
  const mountAnim=a=>{ stopRunner();
    if(a.type==="footwork")runner=footworkPlayer(host,a);
    else if(a.type==="chain")runner=chainPlayer(host,a);
    else if(a.type==="timing")runner=timingPlayer(host,a);
    else if(a.type==="figure")runner=figurePlayer(host,a);
    else if(a.type==="trajectory")runner=trajectoryPlayer(host,a);
    else runner=stancePlayer(host,a); };
  mountAnim(m.anim);
  body.querySelectorAll("#animTabs .chip").forEach(b=>b.onclick=()=>{
    body.querySelectorAll("#animTabs .chip").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); mountAnim(b.dataset.t==="0"?m.anim:m.anim2); });
  body.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>openMove(el.dataset.go));
  document.getElementById("overlay").classList.add("open");
  history.replaceState(null,"","#"+id);
}
function closeModal(){ stopRunner(); document.getElementById("overlay").classList.remove("open");
  history.replaceState(null,"",location.pathname); }
document.getElementById("close").onclick=closeModal;
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

renderCats(); renderGrid();
if(location.hash.length>1) openMove(location.hash.slice(1));
})();
</script>
</body>
</html>
